{% extends "base.html" %}

{% block title %}
Delete Job
{% endblock %}

{% block content %}

<h2>Delete Job</h2>

<p>
    Are you sure you want to delete
    <strong>{{ job.title }}</strong>?
</p>

<p>
    <strong>Company:</strong> {{ job.company }}
</p>

<p>
    <strong>Location:</strong> {{ job.location }}
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Delete Job
    </button>

</form>

<br>

<a href="{% url 'job_detail' job.id %}">
    Cancel
</a>

{% endblock %}
